services:
  postgres:
    image: postgres:16-alpine
    container_name: student-reality-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: student_reality_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d student_reality_lab"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: